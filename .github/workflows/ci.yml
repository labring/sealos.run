name: CI

on: push

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: CI
    runs-on: ubuntu-latest
    services:
      showcase-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: showcase_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: showcase_test
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare debug content
        run: |
          rm -rf content/content
          mkdir -p content/content
          cp -R content-debug/. content/content/

      - name: Test showcase publication and voting
        env:
          SHOWCASE_TEST_DATABASE_URL: postgresql://showcase_test@127.0.0.1:5432/showcase_test
        run: pnpm test:showcase

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run Biome check
        run: pnpm lint:check

      - name: Build website
        run: pnpm build
