apiVersion: batch/v1
kind: CronJob
metadata:
  name: showcase-sync
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 270
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: sync
              # Set this to the website's exact release image, which includes the runner.
              image: sealos-run:replace-with-release-tag
              command: ['node', '/app/scripts/run-showcase-sync.ts']
              env:
                - name: SHOWCASE_SYNC_URL
                  # Set the website Service name and Service port in this namespace.
                  value: 'http://sealos-run:3000/api/showcase/sync'
                - name: SHOWCASE_SYNC_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: showcase-sync
                      key: SHOWCASE_SYNC_SECRET
